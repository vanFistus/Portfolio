name: Update market data

on:
  schedule:
    # 05:30 UTC = 07:30 Uhr Sommerzeit / 06:30 Uhr Winterzeit
    - cron: "30 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: vermoegens-monitor-github/requirements.txt


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: vermoegens-monitor-github


      - name: Update market prices
        run: python fetch_data.py
        working-directory: vermoegens-monitor-github


      - name: Update fundamentals
        run: python fetch_fundamentals.py
        working-directory: vermoegens-monitor-github


      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vermoegens-monitor-github/data/market_data.json
          git add vermoegens-monitor-github/data/fundamentals.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update market data"
          git push
